server:
  host: 127.0.0.1
  port: 8420

data:
  # TDAI_DATA_DIR overrides this value during the isolated acceptance run.
  baseDir: /opt/tdai-data

llm:
  # Credentials are injected through TDAI_LLM_* in the private Docker volume.
  baseUrl: https://api.minimaxi.com/v1
  model: MiniMax-M2
  maxTokens: 4096
  timeoutMs: 180000
  disableThinking: true

memory:
  timezone: Asia/Shanghai
  capture:
    enabled: true
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 30
  persona:
    # Acceptance tuning: generate L3 as soon as new L1 memories exist.
    triggerEveryN: 1
    maxScenes: 15
  pipeline:
    everyNConversations: 1
    enableWarmup: true
    l1IdleTimeoutSeconds: 30
    l2DelayAfterL1Seconds: 0
    l2MinIntervalSeconds: 0
    l2MaxIntervalSeconds: 60
    sessionActiveWindowHours: 24
  recall:
    enabled: true
    maxResults: 10
    scoreThreshold: 0
    strategy: keyword
    timeoutMs: 10000
  embedding:
    enabled: false
    provider: none

